[project]
name = "delta-price-tracker"
version = "0.1.0"
description = "A Python application that monitors Delta Airlines flight prices and notifies users when prices drop, helping travelers save money through Delta's price difference refund policy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.7",
    "httpx>=0.28.1",
    "redis>=5.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
hello = "uv_docker_example:hello"

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.2",
    "fastapi-cli>=0.0.5",
    "mypy>=1.14.1",
    "pydantic>=2.10.6",
    "pre-commit>=4.1.0",
]

[tool.hatch.build.targets.wheel]
      packages = ["app"]

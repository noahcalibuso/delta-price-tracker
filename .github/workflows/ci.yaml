name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_name }}-${{
    github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "build image"
    runs-on: alpine-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          tags: delta-price-tracker:latest
          cache-from: type=gha,scope=delta-price-tracker
          cache-to: type=gha,mode=min,scope=delta-price-tracker
          outputs: type=docker,dest=/tmp/delta-price-tracker.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delta-price-tracker
          path: /tmp/delta-price-tracker.tar
      - name: Run Ruff  
        run: ruff check --output-format=github .

  test:
    name: "test image"
    runs-on: alpine-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: delta-price-tracker
          path: /tmp

      - name: Load images
        run: |
          docker load --input /tmp/delta-price-tracker.tar
          docker image ls -a

      - name: Test command line
        run: ./run.sh hello

      - name: Test Docker compose
        run: |
          docker compose up --watch -d
          docker compose down
